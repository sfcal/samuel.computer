# Every page is its own file (/writing/ is /writing/index.html). Pages and the
# files beside them keep stable addresses, so they must revalidate to pick up a
# redeploy. Everything Astro builds into /_astro/ (scripts, fonts, pictures) has
# its content's hash in its name, so it is safe to cache forever.
map $uri $cache_control {
    default    "no-cache";
    ~^/_astro/ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    error_page 404 /404.html;

    add_header Cache-Control $cache_control always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }
}

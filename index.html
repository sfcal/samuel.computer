<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Samuel Calvert - Infrastructure Engineer</title>
    <!-- Baseline meta for scrapers that don't execute JS; react-helmet-async overrides per route -->
    <meta name="description" content="Computer Engineering professional specializing in infrastructure automation, networking, and systems troubleshooting." />
    <meta property="og:title" content="Samuel Calvert - Infrastructure Engineer" />
    <meta property="og:description" content="Computer Engineering professional specializing in infrastructure automation, networking, and systems troubleshooting." />
    <meta property="og:image" content="https://samuel.computer/headshot.jpeg" />
    <meta property="og:url" content="https://samuel.computer" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Apply the theme before first paint to avoid a light-mode flash -->
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
